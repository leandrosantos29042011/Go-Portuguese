    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0B3CFF;
            color: #0A1845;
            user-select: none;
            overflow-x: hidden;
            background-image: radial-gradient(rgba(255, 255, 255, 0.18) 16%, transparent 16%);
            background-size: 28px 28px;
        }

        .lp-block {
            background: #FFFFFF;
            border: 3.5px solid #001A80;
            border-radius: 24px;
            box-shadow: 0 8px 0 #001A80;
        }
        .lp-block-btn {
            border: 3.5px solid #001A80;
            border-radius: 18px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 800;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.1s ease;
            cursor: pointer;
        }
        .lp-block-btn:hover {
            transform: translateY(-3px);
        }
        .lp-block-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #001A80 !important;
        }

        .logo-font {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            line-height: 0.85;
            color: #FFFFFF;
            text-shadow: 
                4px 4px 0 #001A80,
                -4px -4px 0 #001A80,
                4px -4px 0 #001A80,
                -4px 4px 0 #001A80,
                8px 10px 0 rgba(0, 0, 0, 0.35);
        }

        @keyframes miniBounce {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-10px) rotate(-4deg); }
        }
        .animate-logo-bounce {
            animation: miniBounce 2.5s infinite ease-in-out;
        }

        @keyframes pulseAura {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.7)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 20px rgba(0, 229, 255, 1)); transform: scale(1.03); }
        }
        .aura-glow-cyan { animation: pulseAura 2s infinite ease-in-out; }

        @keyframes shakeHard {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px) rotate(-2deg); }
            40% { transform: translateX(12px) rotate(2deg); }
            60% { transform: translateX(-8px) rotate(-1deg); }
            80% { transform: translateX(8px) rotate(1deg); }
        }
        .animate-shake { animation: shakeHard 0.45s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.5); }
            20% { opacity: 1; transform: translateY(-10px) scale(1.2); }
            80% { opacity: 1; transform: translateY(-40px) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
        }
        .animate-score-pop { animation: floatUp 1.2s ease-out forwards; }

        @keyframes podiumRise {
            0% { opacity: 0; transform: translateY(100px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-podium-rise { animation: podiumRise 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #001A80; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #00E5FF; border-radius: 8px; border: 2px solid #001A80; }
    </style>
</head>

    <!-- MAIN APP SCRIPT -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.soundOn = true;
                this.musicOn = true;
                this.musicVolume = 0.25;
                this.masterGain = null;
                this.musicGain = null;
                this.musicTimer = null;
                this.noteIndex = 0;
                this.audioStarted = false;
            }

            ensureAudioStarted() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 1.0;
                    this.masterGain.connect(this.ctx.destination);

                    this.musicGain = this.ctx.createGain();
                    this.musicGain.gain.value = this.musicVolume;
                    this.musicGain.connect(this.masterGain);
                }

                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                if (!this.audioStarted) {
                    this.audioStarted = true;
                    if (this.musicOn) {
                        this.startBackgroundChiptune();
                    }
                }
            }

            setMusicVolume(val) {
                this.musicVolume = parseFloat(val);
                if (this.musicGain && this.ctx) {
                    this.musicGain.gain.setValueAtTime(this.musicVolume, this.ctx.currentTime);
                }
                this.musicOn = this.musicVolume > 0;
                this.updateMusicUI();
            }

            toggleMusic(e) {
                if (e) e.stopPropagation();
                this.ensureAudioStarted();
                this.musicOn = !this.musicOn;
                
                if (this.musicOn) {
                    if (this.musicVolume === 0) this.musicVolume = 0.25;
                    this.startBackgroundChiptune();
                } else {
                    this.stopBackgroundChiptune();
                }
                this.updateMusicUI();
            }

            toggleSound(e) {
                if (e) e.stopPropagation();
                this.ensureAudioStarted();
                this.soundOn = !this.soundOn;
                const icon = document.getElementById('soundIcon');
                const txt = document.getElementById('soundText');
                if (this.soundOn) {
                    if (icon) icon.className = 'fas fa-volume-up text-brandBlue';
                    if (txt) txt.innerText = 'SFX: ON';
                    this.playPop();
                } else {
                    if (icon) icon.className = 'fas fa-volume-mute text-gray-400';
                    if (txt) txt.innerText = 'SFX: OFF';
                }
            }

            updateMusicUI() {
                const icon = document.getElementById('musicIcon');
                const txt = document.getElementById('musicText');
                const slider = document.getElementById('musicVolSlider');

                if (slider) slider.value = this.musicOn ? this.musicVolume : 0;

                if (this.musicOn) {
                    if (icon) icon.className = 'fas fa-music text-brandCyan animate-bounce';
                    if (txt) txt.innerText = 'Música: ON';
                } else {
                    if (icon) icon.className = 'fas fa-music text-gray-400';
                    if (txt) txt.innerText = 'Música: OFF';
                }
            }

            playTone(freq, type, duration, startVol = 0.15, endVol = 0.001, isMusic = false) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(isMusic ? this.musicGain : this.masterGain);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playPop() {
                if (!this.soundOn) return;
                this.playTone(580, 'sine', 0.08, 0.15);
            }

            playClick() {
                if (!this.soundOn) return;
                this.playTone(420, 'triangle', 0.05, 0.12);
            }

            playCorrect() {
                if (!this.soundOn) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'triangle', 0.14, 0.18);
                    }, idx * 60);
                });
            }

            playWrong() {
                if (!this.soundOn) return;
                this.playTone(220, 'sawtooth', 0.15, 0.22);
                setTimeout(() => this.playTone(160, 'sawtooth', 0.25, 0.22), 100);
            }

            playFanfare() {
                if (!this.soundOn) return;
                const melody = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.50];
                const delays = [0, 120, 240, 360, 500, 700];
                melody.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'triangle', 0.3, 0.25);
                    }, delays[idx]);
                });
            }

            startBackgroundChiptune() {
                this.stopBackgroundChiptune();
                const melody = [
                    261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23,
                    329.63, 392.00, 523.25, 659.25, 523.25, 392.00, 293.66, 349.23, 440.00, 523.25
                ];
                
                this.musicTimer = setInterval(() => {
                    if (!this.musicOn || !this.ctx) return;
                    const note = melody[this.noteIndex % melody.length];
                    this.playTone(note, 'sine', 0.18, 0.08, 0.001, true);
                    
                    if (this.noteIndex % 2 === 0) {
                        this.playTone(note / 2, 'triangle', 0.2, 0.05, 0.001, true);
                    }
                    this.noteIndex++;
                }, 200);
            }

            stopBackgroundChiptune() {
                if (this.musicTimer) {
                    clearInterval(this.musicTimer);
                    this.musicTimer = null;
                }
            }
        }

        function renderLayeredAvatarSvg(custom, sizePx = 100) {
            const skin = AVATAR_LAYERS.skins.find(s => s.id === custom.skin) || AVATAR_LAYERS.skins[0];
            const hair = AVATAR_LAYERS.hairstyles.find(h => h.id === custom.hair) || AVATAR_LAYERS.hairstyles[0];
            const cloth = AVATAR_LAYERS.clothes.find(c => c.id === custom.cloth) || AVATAR_LAYERS.clothes[0];

            const acc = custom.acc || 'none';
            const accColor = custom.accColor || '#0B3CFF';

            return `
            <div class="relative inline-block ${aura === 'cyan_glow' ? 'aura-glow-cyan' : ''}" style="width: ${sizePx}px; height: ${sizePx}px;">

                    ${cloth.id === 'hoodie' ? `

                    ` : cloth.id === 'suit' ? `

                    ${expr === 'happy' ? `

                        <circle cx="77" cy="86" r="3" fill="#FFFFFF"/>

                    ` : expr === 'cool' ? `

                        <circle cx="125" cy="88" r="7" fill="#001A80"/>
                        <path d="M 82 118 Q 100 120 118 112" fill="none" stroke="#001A80" stroke-width="5" stroke-linecap="round"/>

        function normalizeText(str) {
            return str.toLowerCase()

        const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:8000';
        async function callApi(path, method = 'GET', body = null) {
            try {
                const options = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };
                if (body) options.body = JSON.stringify(body);
                const res = await fetch(`${API_BASE}${path}`, options);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.detail || `Erro HTTP ${res.status}`);
                }
                return data;
            } catch (err) {
                console.warn('API call:', path, err.message);
                throw err;
            }
        }

            handleBroadcastMsg(msg) {

                    return;
                }
                this.joinedRoomCode = code;
                this.matchStarted = false;

                try {
                    await callApi('/api/rooms/join', 'POST', {
                        room_code: code,
                        player_name: this.user.name,
                        avatar: this.user.avatar
                    });
                } catch (e) {
                    console.warn('Conectando no modo local:', e.message);
                }

                const waitingCard = document.getElementById('lobbyWaitingCard');
                if (waitingCard) waitingCard.classList.remove('hidden');
                const badge = document.getElementById('displayRoomBadge');
                if (badge) badge.innerText = "Porta: " + code;

                this.broadcastUser();
                this.startStudentPolling();
                audioManager.playCorrect();
            }

            startStudentPolling() {
                if (this.pollTimer) clearInterval(this.pollTimer);
                const poll = async () => {
                    if (!this.joinedRoomCode) return;
                    try {
                        const data = await callApi(`/api/rooms/${this.joinedRoomCode}/status`);
                        if (data) {
                            if (data.players && Array.isArray(data.players)) {
                                this.classmates = data.players.filter(p => p.name !== this.user.name);
                                this.refreshLobbyList();
                            }
                            if (data.status === 'IN_GAME' && !this.matchStarted) {
                                this.matchStarted = true;
                                if (this.pollTimer) clearInterval(this.pollTimer);
                                this.startMatch();
                            }
                        }
                    } catch (e) {}
                };
                this.pollTimer = setInterval(poll, 2000);
                poll();
            }

            refreshLobbyList() {
                const listElem = document.getElementById('lobbyPlayersList');
                if (listElem) {
                    listElem.innerHTML = this.renderLobbyPlayers();
                }
            }

            renderLobbyPlayers() {
                const all = [this.user, ...this.classmates];
                return all.map(p => `
                    <div class="flex items-center justify-between p-2 rounded-xl bg-blue-50/50 border-2 border-blue-200">
                        <div class="flex items-center gap-3">
                            ${renderLayeredAvatarSvg(p.avatar, 40)}
                            <div>
                                <div class="font-bold text-sm text-brandBlueDark">${p.name} ${p.name === this.user.name ? '<span class="text-xs text-brandCyan font-black">(Você)</span>' : ''}</div>
                                <div class="text-xs text-gray-500 font-semibold">No Saguão</div>
                            </div>
                        </div>
                        <span class="w-3 h-3 rounded-full bg-brandGreen animate-ping"></span>
                    </div>
                `).join('');
            }

            updateAvatar(key, value) {
                audioManager.playPop();
                this.user.avatar[key] = value;
                const container = document.getElementById('avatarPreviewContainer');
                if (container) {
                    container.innerHTML = renderLayeredAvatarSvg(this.user.avatar, 140);
                }
                this.broadcastUser();
            }

            startMatch() {
                audioManager.playPop();
                this.timeLeft = 25 * 60;
                this.currentQuestionIdx = 0;
                this.answers = [];
                this.user.score = 0;
                this.startTimer();
                this.renderQuestionView();
            }

            startTimer() {
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    this.user.timeSeconds++;
                    const timerElem = document.getElementById('matchTimer');
                    if (timerElem) {
                        const m = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
                        const s = (this.timeLeft % 60).toString().padStart(2, '0');
                        timerElem.innerText = `${m}:${s}`;
                    }
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timerInterval);
                        this.finishMatch();
                    }
                }, 1000);
            }

            renderQuestionView() {
                const q = QUESTIONS[this.currentQuestionIdx];
                const appElem = document.getElementById('appContainer');

                appElem.innerHTML = `
                    <div id="gameCardWrapper" class="w-full max-w-3xl flex flex-col gap-4">
                        <div class="lp-block bg-white p-4 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                ${renderLayeredAvatarSvg(this.user.avatar, 48)}
                                <div>
                                    <span class="font-fredoka text-xs text-brandBlue font-black uppercase">Questão ${this.currentQuestionIdx + 1} de ${QUESTIONS.length}</span>
                                    <div class="font-bold text-sm text-brandBlueDark">${q.cat}</div>
                                </div>
                            </div>

                            <div class="flex items-center gap-4">
                                <div class="bg-yellow-100 border-2 border-brandBlueDark px-3 py-1 rounded-xl flex items-center gap-2">
                                    <i class="fas fa-star text-yellow-500"></i>
                                    <span class="font-fredoka text-lg font-bold text-brandBlueDark">${this.user.score}</span>
                                </div>
                                <div class="bg-blue-100 border-2 border-brandBlueDark px-3 py-1 rounded-xl flex items-center gap-2">
                                    <i class="fas fa-clock text-brandBlue"></i>
                                    <span id="matchTimer" class="font-fredoka text-lg font-bold text-brandBlueDark">25:00</span>
                                </div>
                            </div>
                        </div>

                        <div class="w-full bg-blue-900 border-2 border-white h-4 rounded-full overflow-hidden">
                            <div class="bg-brandCyan h-full transition-all duration-300" style="width: ${((this.currentQuestionIdx + 1) / QUESTIONS.length) * 100}%"></div>
                        </div>

                        <div class="lp-block bg-white p-6 sm:p-8">
                            <h2 class="font-fredoka text-xl sm:text-2xl font-bold text-brandBlueDark mb-6 leading-relaxed">
                                ${q.q}
                            </h2>

                            <div id="optionsContainer" class="space-y-3">
                                ${q.type === 'mc' ? q.options.map((opt, idx) => `
                                    <button id="optBtn_${idx}" onclick="app.selectAnswer(${idx})" 
                                        class="w-full text-left p-4 rounded-xl border-3 border-brandBlueDark bg-blue-50/50 hover:bg-blue-100 font-bold text-brandBlueDark transition flex items-center justify-between group shadow-lp-sm hover:scale-[1.01]">
                                        <span><strong class="text-brandBlue mr-2">${String.fromCharCode(65 + idx)})</strong> ${opt}</span>
                                        <i class="fas fa-chevron-right text-blue-300 group-hover:text-brandBlue transition"></i>
                                    </button>
                                `).join('') : `
                                    <div class="space-y-4">
                                        <input type="text" id="fillBlankInput" placeholder="Sua resposta aqui..." 
                                            onkeypress="if(event.key === 'Enter') app.submitFillBlank()"
                                            class="w-full border-3 border-brandBlueDark rounded-xl p-4 text-lg font-bold focus:outline-none focus:bg-blue-50">
                                        <button onclick="app.submitFillBlank()" class="w-full lp-block-btn bg-brandBlue text-white py-3 shadow-lp-blue text-lg">
                                            Confirmar Resposta
                                        </button>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            selectAnswer(selectedIdx) {
                const q = QUESTIONS[this.currentQuestionIdx];
                const isCorrect = selectedIdx === q.ans;
                this.handleAnswerFeedback(isCorrect, q, selectedIdx);
            }

            submitFillBlank() {
                const input = document.getElementById('fillBlankInput').value;
                const q = QUESTIONS[this.currentQuestionIdx];
                
                const normInput = normalizeText(input);
                const normTarget = normalizeText(q.answer);

                const isCorrect = normInput.length > 0 && normInput === normTarget;
                this.handleAnswerFeedback(isCorrect, q, null);
            }

            handleAnswerFeedback(isCorrect, q, selectedIdx) {
                const feedbackElem = document.getElementById('feedbackContainer');
                const cardElem = document.getElementById('gameCardWrapper');

                if (isCorrect) {
                    audioManager.playCorrect();
                    this.user.score += 100;

                    feedbackElem.innerHTML = `
                        <div class="animate-score-pop font-fredoka text-4xl sm:text-6xl font-black text-yellow-300 drop-shadow-[0_4px_0_#000] flex flex-col items-center">
                            <span>+100 PONTOS!</span>
                            <span class="text-2xl text-white">RESPOSTA CORRETA! ✨</span>
                        </div>
                    `;
                    try { confetti({ particleCount: 50, spread: 70, origin: { y: 0.7 } }); } catch(e) {}
                    
                    this.answers.push({ qId: q.id, isCorrect: true });
                    setTimeout(() => {
                        feedbackElem.innerHTML = '';
                        this.nextQuestion();
                    }, 1000);

                } else {
                    audioManager.playWrong();
                    if (cardElem) {
                        cardElem.classList.add('animate-shake');
                        setTimeout(() => cardElem.classList.remove('animate-shake'), 450);
                    }

                    if (q.type === 'mc' && selectedIdx !== null) {
                        const wrongBtn = document.getElementById(`optBtn_${selectedIdx}`);
                        const correctBtn = document.getElementById(`optBtn_${q.ans}`);
                        if (wrongBtn) wrongBtn.className = "w-full text-left p-4 rounded-xl border-3 border-red-600 bg-red-100 font-bold text-red-900";
                        if (correctBtn) correctBtn.className = "w-full text-left p-4 rounded-xl border-3 border-green-600 bg-green-100 font-bold text-green-900 animate-pulse";
                    }

                    const correctText = q.type === 'mc' ? q.options[q.ans] : q.answer;

                    feedbackElem.innerHTML = `
                        <div class="bg-brandBlueDark border-4 border-white p-6 rounded-2xl shadow-2xl max-w-lg text-center text-white pointer-events-auto">
                            <h3 class="font-fredoka text-3xl font-black text-brandRed mb-2">RESPOSTA INCORRETA! ❌</h3>
                            <p class="text-sm font-bold mb-2">A resposta correta era: <span class="text-brandCyan underline">${correctText}</span></p>
                            <div class="bg-white/10 p-3 rounded-xl text-xs text-white/90 mb-4 text-left">
                                <strong>Explicação:</strong> ${q.exp}
                            </div>
                            <button onclick="document.getElementById('feedbackContainer').innerHTML=''; app.nextQuestion();" 
                                class="lp-block-btn bg-brandCyan text-brandBlueDark px-6 py-2 text-base font-black">
                                Próxima Questão
                            </button>
                        </div>
                    `;

                    this.answers.push({ qId: q.id, isCorrect: false });
                }
            }

            nextQuestion() {
                this.broadcastUser();
                if (this.currentQuestionIdx < QUESTIONS.length - 1) {
                    this.currentQuestionIdx++;
                    this.renderQuestionView();
                } else {
                    this.finishMatch();
                }
            }

            async finishMatch() {
                clearInterval(this.timerInterval);
                this.user.completed = true;
                this.broadcastUser();
                audioManager.playFanfare();
                if (this.joinedRoomCode) {
                    try {
                        const data = await callApi(`/api/rooms/${this.joinedRoomCode}/status`);
                        if (data && data.players && Array.isArray(data.players)) {
                            this.classmates = data.players.filter(p => p.name !== this.user.name);
                        }
                    } catch (e) {}
                }
                this.renderGrandFinale();
            }

            renderGrandFinale() {
                const allRanked = [this.user, ...this.classmates]
                    .sort((a, b) => b.score - a.score || a.timeSeconds - b.timeSeconds)
                    .slice(0, 10);

                const top3 = allRanked.slice(0, 3);
                const restTop10 = allRanked.slice(3, 10);

                const appElem = document.getElementById('appContainer');
                appElem.innerHTML = `
                    <div class="w-full max-w-4xl flex flex-col items-center gap-6 my-auto">
                        <div class="text-center">
                            <h1 class="logo-font text-5xl sm:text-6xl tracking-tight mb-2">go, portuguese!</h1>
                            <p class="font-bold text-white text-lg">Cerimônia dos Campeões - Pódio da Sala</p>
                        </div>

                        <div class="w-full flex items-end justify-center gap-2 sm:gap-6 pt-12 pb-4">
                            ${top3[1] ? `
                                <div class="flex flex-col items-center animate-podium-rise" style="animation-delay: 0.2s">
                                    <div class="mb-2">${renderLayeredAvatarSvg(top3[1].avatar, 80)}</div>
                                    <span class="font-fredoka font-extrabold text-xs sm:text-sm text-white mb-1">${top3[1].name}</span>
                                    <div class="w-24 sm:w-32 h-36 bg-blue-600 border-3 border-white rounded-t-2xl shadow-lp flex flex-col items-center justify-center text-white">
                                        <span class="font-fredoka text-3xl font-black">2º</span>
                                        <span class="text-xs font-bold">${top3[1].score} pts</span>
                                    </div>
                                </div>
                            ` : ''}

                            ${top3[0] ? `
                                <div class="flex flex-col items-center animate-podium-rise z-10" style="animation-delay: 0.5s">
                                    <div class="relative mb-2">
                                        <span class="absolute -top-10 left-1/2 -translate-x-1/2 text-4xl animate-bounce">👑</span>
                                        ${renderLayeredAvatarSvg(top3[0].avatar, 110)}
                                    </div>
                                    <span class="font-fredoka font-black text-sm sm:text-base text-white mb-1">${top3[0].name}</span>
                                    <div class="w-28 sm:w-36 h-48 bg-brandCyan border-3 border-white rounded-t-2xl shadow-lp flex flex-col items-center justify-center text-brandBlueDark">
                                        <span class="font-fredoka text-4xl font-black">1º</span>
                                        <span class="text-xs font-bold">${top3[0].score} pts</span>
                                    </div>
                                </div>
                            ` : ''}

                            ${top3[2] ? `
                                <div class="flex flex-col items-center animate-podium-rise" style="animation-delay: 0.35s">
                                    <div class="mb-2">${renderLayeredAvatarSvg(top3[2].avatar, 75)}</div>
                                    <span class="font-fredoka font-extrabold text-xs sm:text-sm text-white mb-1">${top3[2].name}</span>
                                    <div class="w-24 sm:w-32 h-28 bg-blue-800 border-3 border-white rounded-t-2xl shadow-lp flex flex-col items-center justify-center text-white">
                                        <span class="font-fredoka text-2xl font-black">3º</span>
                                        <span class="text-xs font-bold">${top3[2].score} pts</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="w-full max-w-xl lp-block bg-white p-4">
                            <h3 class="font-fredoka text-sm font-bold text-brandBlue uppercase tracking-wide mb-3 text-center">Classificação da Turma</h3>
                            <div class="space-y-2">
                                ${restTop10.map((p, idx) => `
                                    <div class="flex items-center justify-between p-2 rounded-xl bg-blue-50 border border-blue-200 text-xs font-bold text-brandBlueDark">
                                        <div class="flex items-center gap-3">
                                            <span class="w-6 h-6 rounded-lg bg-brandBlue text-white flex items-center justify-center font-black">${idx + 4}º</span>
                                            <span>${p.name}</span>
                                        </div>
                                        <span>${p.score} pts</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="flex gap-4 pt-2">
                            <button onclick="app.renderPedagogicalReview()" class="lp-block-btn bg-white text-brandBlue px-6 py-3 shadow-lp text-base">
                                <i class="fas fa-book mr-2"></i> Ver Gabarito Completo
                            </button>
                            <button onclick="app.renderHomeScreen()" class="lp-block-btn bg-brandBlueDark text-white border-white px-6 py-3 shadow-lp-sm text-base">
                                <i class="fas fa-home mr-2 text-brandCyan"></i> Menu Inicial
                            </button>
                        </div>
                    </div>
                `;

                try { confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } }); } catch(e) {}
            }

            renderPedagogicalReview() {
                audioManager.playClick();
                const appElem = document.getElementById('appContainer');
                appElem.innerHTML = `
                    <div class="w-full max-w-3xl lp-block bg-white p-6 sm:p-8 space-y-6 my-auto">
                        <div class="flex justify-between items-center border-b-2 border-gray-100 pb-4">
                            <h2 class="font-fredoka text-2xl font-bold text-brandBlue flex items-center gap-2">
                                <i class="fas fa-graduation-cap text-brandCyan"></i> Gabarito Pedagógico
                            </h2>
                            <button onclick="app.renderGrandFinale()" class="lp-block-btn bg-gray-100 text-brandBlue px-4 py-2 text-xs shadow-lp-sm">Voltar ao Pódio</button>
                        </div>

                        <div class="space-y-4 max-h-[55vh] overflow-y-auto pr-2">
                            ${QUESTIONS.map((q, idx) => {
                                const ans = this.answers[idx];
                                const isCorrect = ans ? ans.isCorrect : false;
                                return `
                                    <div class="p-4 rounded-2xl border-2 ${isCorrect ? 'border-green-300 bg-green-50/50' : 'border-red-300 bg-red-50/50'} space-y-2">
                                        <div class="flex justify-between items-start">
                                            <span class="font-fredoka text-xs font-bold uppercase text-gray-500">Questão ${idx + 1} &bull; ${q.cat}</span>
                                            <span class="px-2 py-0.5 rounded-full text-xs font-bold ${isCorrect ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800'}">
                                                ${isCorrect ? 'Acertou' : 'Errou'}
                                            </span>
                                        </div>
                                        <p class="font-bold text-sm text-brandBlueDark">${q.q}</p>
                                        <div class="bg-white p-3 rounded-xl border border-gray-200 text-xs text-gray-700 leading-relaxed">
                                            <strong class="text-brandBlue">Resposta Correta:</strong> ${q.type === 'mc' ? q.options[q.ans] : q.answer}<br>
                                            <strong class="text-brandBlue">Explicação:</strong> ${q.exp}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            openAdminModal() {
                audioManager.playClick();
                document.getElementById('adminModal').classList.remove('hidden');
            }
            closeAdminModal() {
                document.getElementById('adminModal').classList.add('hidden');
            }
            async verifyAdminPin() {
                const inputEl = document.getElementById('adminPinInput');
                const input = inputEl ? inputEl.value.trim() : '';
                let verified = false;
                try {
                    const res = await callApi('/api/teacher/verify', 'POST', { pin: input });
                    if (res && res.success) {
                        this.teacherPin = input;
                        verified = true;
                    }
                } catch (e) {
                    if (input === 'adm@437' || input === this.teacherPin) {
                        this.teacherPin = input;
                        verified = true;
                    }
                }

                if (verified) {
                    document.getElementById('adminLoginStep').classList.add('hidden');
                    document.getElementById('adminDashboardStep').classList.remove('hidden');
                    await this.generateNewRoomCode();
                } else {
                    alert('Senha do professor incorreta!');
                }
            }

            async generateNewRoomCode() {
                let code = '';
                try {
                    const res = await callApi('/api/rooms/create', 'POST', { pin: this.teacherPin });
                    if (res && res.room_code) {
                        code = res.room_code;
                    }
                } catch (e) {}

                if (!code) {
                    code = Math.floor(10000 + Math.random() * 90000).toString();
                }

                this.activeRoomCode = code;
                const disp = document.getElementById('adminRoomCodeDisplay');
                if (disp) disp.innerText = this.activeRoomCode;
                this.startAdminPolling();
            }

            startAdminPolling() {
                if (this.adminPollTimer) clearInterval(this.adminPollTimer);
                this.adminPollTimer = setInterval(async () => {
                    if (!this.activeRoomCode) return;
                    try {
                        const data = await callApi(`/api/rooms/${this.activeRoomCode}/status`);
                        if (data && data.players) {
                            const statusElem = document.getElementById('adminMatchStatus');
                            if (statusElem) {
                                statusElem.innerText = `${data.players.length} Aluno(s) conectado(s)`;
                            }
                        }
                    } catch (e) {}
                }, 2000);
            }

            async forceStartMatch() {
                if (!this.activeRoomCode) {
                    alert('Crie uma Porta da Sala primeiro!');
                    return;
                }
                try {
                    await callApi('/api/rooms/start', 'POST', {
                        room_code: this.activeRoomCode,
                        pin: this.teacherPin
                    });
                } catch (e) {}

                this.channel.postMessage({ type: 'START_MATCH', roomCode: this.activeRoomCode });
                this.closeAdminModal();
                if (this.joinedRoomCode === this.activeRoomCode && !this.matchStarted) {
                    this.startMatch();
                }
            }

            async resetMatch() {
                if (this.activeRoomCode) {
                    try {
                        await callApi('/api/rooms/reset', 'POST', {
                            room_code: this.activeRoomCode,
                            pin: this.teacherPin
                        });
                    } catch (e) {}
                }
                location.reload();
            }
            exportCSV() {
                let csvContent = "data:text/csv;charset=utf-8,Nome,Pontuacao,Status\n";
                const players = [this.user, ...this.classmates];
                players.forEach(p => {
                    csvContent += `${p.name},${p.score},${p.completed ? 'Concluido' : 'Em andamento'}\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "go_portuguese_relatorio.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        let app;
        window.onload = function() {
            app = new GoPortugueseApp();
        };
    </script>
</body>
</html>
